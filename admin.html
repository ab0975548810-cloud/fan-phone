<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>本福丸訂製｜後台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--pink:#ff789e;--pink2:#fff0f5;--ink:#332c30;--muted:#8e8288;--line:#f2dfe6;--bg:#fff8fb;--green:#27a266;--red:#dc5064;--shadow:0 8px 28px rgba(180,75,110,.07)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.app{height:100%;display:flex;overflow:hidden}.side{width:220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}.brand{height:66px;display:flex;align-items:center;justify-content:center;color:var(--pink);font-weight:950;font-size:19px;border-bottom:1px solid var(--line)}.nav{padding:12px 8px;overflow:auto}.nav button{width:100%;border:0;background:transparent;border-radius:14px;padding:13px 14px;text-align:left;color:#71666b;font-weight:850;cursor:pointer;margin:2px 0}.nav button i{width:24px}.nav button.active{background:var(--pink2);color:var(--pink)}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:58px;flex:none;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 18px}.top a,.btn{border:0;border-radius:999px;padding:9px 15px;text-decoration:none;cursor:pointer;font-weight:900;font-size:13px}.btn{background:var(--pink);color:#fff}.btn.alt,.top a{background:#fff;color:var(--pink);border:1px solid #f1b6c8}.btn.danger{background:#fff;color:var(--red);border:1px solid #efc0c9}.content{flex:1;overflow:auto;padding:20px}.view{display:none}.view.active{display:block}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.titlebar h2{font-size:20px;margin:0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{background:#fff2f6;color:#df5e86;padding:11px;text-align:left;white-space:nowrap}.tbl td{padding:11px;border-bottom:1px solid #f5eaee;vertical-align:middle}.order-thumb{width:82px;height:96px;object-fit:contain;background:#f8f5f6;border-radius:10px;border:1px solid #f1e4e8}.tag{display:inline-flex;padding:4px 9px;border-radius:999px;background:#fff1f0;color:var(--red);font-weight:900;font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}.card{border:1px solid var(--line);border-radius:15px;background:#fffafb;padding:10px;position:relative}.card img{width:100%;height:125px;object-fit:contain;border-radius:10px}.card .name{font-weight:900;font-size:13px;margin-top:7px}.card small{color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.pill{border:1px solid var(--line);background:#fff;color:#786d72;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:850;white-space:nowrap;cursor:pointer}.pill.active{background:var(--pink);color:#fff;border-color:var(--pink)}.loading,.empty{padding:34px;text-align:center;color:#a09499}.ok{color:var(--green);font-weight:900}.bad{color:var(--red);font-weight:900}.modal{position:fixed;inset:0;background:rgba(35,29,32,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}.modal.show{display:flex}.box{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 18px 55px rgba(0,0,0,.18)}.box.wide{width:min(980px,98vw)}.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#fff1f6;color:#d95580;font-weight:950;position:sticky;top:0;z-index:4}.mb{padding:17px}.mf{padding:13px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row.four{grid-template-columns:repeat(4,minmax(0,1fr))}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#766a70;font-weight:850;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #eadce1;border-radius:12px;padding:10px 11px;background:#fff}.upload{border:1px dashed #efb5c6;border-radius:13px;padding:12px;text-align:center;background:#fff9fb}.upload img{max-height:100px;max-width:100%;display:block;margin:auto}.editor{height:520px;background:#f0edef;border-radius:14px;display:grid;place-items:center;overflow:hidden;position:relative}.canvas-wrap{background:white;box-shadow:0 5px 18px rgba(0,0,0,.12)}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.notice{font-size:12px;color:var(--muted);margin:8px 0}.asset-loading{min-height:120px;display:grid;place-items:center;color:#aaa}.del{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;border:0;background:#fff;color:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer}.mini{padding:6px 10px!important;font-size:11px!important}
@media(max-width:800px){.side{width:72px}.brand span,.nav button span{display:none}.brand i{font-size:22px}.nav button{text-align:center;padding:14px 8px}.nav button i{width:auto;font-size:18px}.content{padding:10px}.panel{padding:10px}.row,.row.four{grid-template-columns:1fr}.tbl{font-size:11px}.order-thumb{width:65px;height:78px}.top{padding:0 10px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i class="fa-solid fa-wand-magic-sparkles"></i>&nbsp;<span>本福丸訂製</span></div>
    <div class="nav">
      <button class="active" data-view="orders"><i class="fa-solid fa-list-check"></i><span>訂單管理</span></button>
      <button data-view="models"><i class="fa-solid fa-mobile-screen"></i><span>品牌及型號</span></button>
      <button data-view="styles"><i class="fa-solid fa-layer-group"></i><span>手機殼材質</span></button>
      <button data-view="assets"><i class="fa-solid fa-face-smile"></i><span>素材庫</span></button>
      <button data-view="templates"><i class="fa-solid fa-border-all"></i><span>模板庫</span></button>
    </div>
  </aside>
  <main class="main">
    <div class="top"><a href="/admin/orders-fast"><i class="fa-solid fa-bolt"></i> 快速訂單</a><a href="/" target="_blank"><i class="fa-solid fa-eye"></i> 前台</a></div>
    <div class="content">
      <section class="view active" id="view-orders">
        <div class="titlebar"><h2>訂單管理</h2><button class="btn alt" onclick="refreshOrders(true)"><i class="fa-solid fa-rotate"></i> 重新整理</button></div>
        <div class="panel"><div class="table-wrap"><table class="tbl"><thead><tr><th>訂單</th><th>商品</th><th>預覽</th><th>狀態</th><th>生產圖</th></tr></thead><tbody id="orders-body"><tr><td colspan="5" class="loading">讀取中…</td></tr></tbody></table></div></div>
      </section>
      <section class="view" id="view-models">
        <div class="titlebar"><h2>品牌及型號</h2><button class="btn" onclick="openModelEditor()"><i class="fa-solid fa-plus"></i> 新增型號</button></div>
        <div class="panel"><div class="titlebar"><b>品牌</b><button class="btn alt mini" onclick="addBrand()">新增品牌</button></div><div id="brand-pills" class="tabs"></div><div class="table-wrap"><table class="tbl"><thead><tr><th>品牌</th><th>型號</th><th>遮罩</th><th>操作</th></tr></thead><tbody id="models-body"></tbody></table></div></div>
      </section>
      <section class="view" id="view-styles">
        <div class="titlebar"><h2>手機殼材質</h2><button class="btn" onclick="openStyleEditor()"><i class="fa-solid fa-plus"></i> 新增材質</button></div>
        <div class="panel"><div class="table-wrap"><table class="tbl"><thead><tr><th>名稱</th><th>售價</th><th>顏色</th><th>操作</th></tr></thead><tbody id="styles-body"></tbody></table></div></div>
      </section>
      <section class="view" id="view-assets">
        <div class="titlebar"><h2>素材庫</h2><button class="btn" onclick="document.getElementById('sticker-files').click()"><i class="fa-solid fa-cloud-arrow-up"></i> 批量上傳</button></div>
        <input id="sticker-files" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden onchange="uploadStickers(event)">
        <div class="panel"><div id="asset-tabs" class="tabs"></div><div id="asset-grid" class="asset-loading">點進素材庫時才載入，減少後台卡頓。</div></div>
      </section>
      <section class="view" id="view-templates">
        <div class="titlebar"><h2>模板庫</h2><button class="btn" onclick="openTemplateEditor()"><i class="fa-solid fa-plus"></i> 建立模板</button></div>
        <div class="panel"><div id="template-tabs" class="tabs"></div><div id="template-grid" class="asset-loading">點進模板庫時才載入模板與編輯器。</div></div>
      </section>
    </div>
  </main>
</div>

<div class="modal" id="model-modal"><div class="box"><div class="mh"><span>型號設定</span><button class="btn danger mini" onclick="closeModal('model-modal')">關閉</button></div><div class="mb">
<input type="hidden" id="model-id"><div class="row"><div class="field"><label>品牌</label><select id="model-brand"></select></div><div class="field"><label>型號名稱</label><input id="model-name"></div></div>
<div class="row"><div class="field"><label>預覽遮罩 PNG</label><div class="upload"><img id="model-mask-img"><input id="model-mask-url" type="hidden"><button class="btn alt mini" onclick="document.getElementById('model-mask-file').click()">上傳遮罩</button><input id="model-mask-file" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="uploadModelImage(event,'mask')"></div></div><div class="field"><label>打印線圖 PNG</label><div class="upload"><img id="model-line-img"><input id="model-line-url" type="hidden"><button class="btn alt mini" onclick="document.getElementById('model-line-file').click()">上傳線圖</button><input id="model-line-file" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="uploadModelImage(event,'line')"></div></div></div>
<div class="row four"><div class="field"><label>X mm</label><input id="model-x" type="number" step="0.1"></div><div class="field"><label>Y mm</label><input id="model-y" type="number" step="0.1"></div><div class="field"><label>W mm</label><input id="model-w" type="number" step="0.1"></div><div class="field"><label>H mm</label><input id="model-h" type="number" step="0.1"></div></div>
</div><div class="mf"><button class="btn danger" onclick="closeModal('model-modal')">取消</button><button class="btn" onclick="saveModel()">儲存</button></div></div></div>

<div class="modal" id="style-modal"><div class="box"><div class="mh"><span>材質設定</span><button class="btn danger mini" onclick="closeModal('style-modal')">關閉</button></div><div class="mb">
<input id="style-id" type="hidden"><div class="row"><div class="field"><label>材質名稱</label><input id="style-name"></div><div class="field"><label>售價</label><input id="style-price" type="number" min="1"></div></div><div class="field"><label>顏色（用逗號分隔）</label><input id="style-colors" placeholder="透明, 黑, 粉"></div>
<div class="row four"><div class="field"><label>X mm</label><input id="style-x" type="number" step="0.1"></div><div class="field"><label>Y mm</label><input id="style-y" type="number" step="0.1"></div><div class="field"><label>W mm</label><input id="style-w" type="number" step="0.1"></div><div class="field"><label>H mm</label><input id="style-h" type="number" step="0.1"></div></div>
</div><div class="mf"><button class="btn danger" onclick="closeModal('style-modal')">取消</button><button class="btn" onclick="saveStyle()">儲存</button></div></div></div>

<div class="modal" id="template-modal"><div class="box wide"><div class="mh"><span id="tpl-title">視覺化模板編輯器</span><button class="btn danger mini" onclick="closeModal('template-modal')">關閉</button></div><div class="mb">
<input id="tpl-id" type="hidden"><div class="row"><div class="field"><label>綁定型號</label><select id="tpl-model" onchange="initEditor()"></select></div><div class="field"><label>模板名稱</label><input id="tpl-name"></div></div><div class="field"><label>分類</label><input id="tpl-category" value="熱門"></div>
<div class="editor"><div class="canvas-wrap" id="canvas-wrap"><canvas id="tpl-canvas"></canvas></div></div>
<div class="toolbar"><button class="btn alt mini" onclick="document.getElementById('tpl-bg-file').click()">更換底圖</button><input id="tpl-bg-file" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="uploadTemplateBg(event)"><button class="btn alt mini" onclick="addSlot()">新增照片插槽</button><button class="btn alt mini" onclick="addText()">加入文字</button><button class="btn alt mini" onclick="pickSticker()">加入貼紙</button><button class="btn danger mini" onclick="deleteEditorObject()">刪除選取</button></div><div class="notice">Fabric 編輯器只在你開啟模板時才下載，不會拖慢平常訂單後台。</div>
</div><div class="mf"><button class="btn danger" onclick="closeModal('template-modal')">取消</button><button class="btn" onclick="saveTemplate()">儲存模板</button></div></div></div>

<script>
const $=id=>document.getElementById(id);let currentView='orders';let shopData={brands:[],models:[],styles:[]};let assetsData={stickers:[],categories:['全部']};let templatesData={templates:[],categories:['全部','熱門']};let shopLoaded=false,assetsLoaded=false,templatesLoaded=false,ordersBusy=false;let currentAsset='全部',currentTpl='全部';let fabricPromise=null,visualCanvas=null,tplW=0,tplH=0;const VISUAL_SCALE=2;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}
async function apiJson(url,opt){const r=await fetch(url,opt);let j={};try{j=await r.json()}catch(e){}if(!r.ok||j.status==='error')throw new Error(j.msg||('HTTP '+r.status));return j}
function openModal(id){$(id).classList.add('show')}function closeModal(id){$(id).classList.remove('show')}
async function loadShop(force=false){if(shopLoaded&&!force)return;const j=await apiJson('/api/shop_data?ts='+Date.now(),{cache:'no-store'});shopData=j.data||{brands:[],models:[],styles:[]};shopLoaded=true;renderBrands();renderModels();renderStyles()}
async function loadAssets(force=false){if(assetsLoaded&&!force){renderAssetTabs();renderAssets();return}const box=$('asset-grid');box.className='asset-loading';box.textContent='素材載入中…';const j=await apiJson('/api/assets?ts='+Date.now(),{cache:'no-store'});assetsData=j.data||{stickers:[],categories:['全部']};assetsLoaded=true;renderAssetTabs();renderAssets()}
async function loadTemplates(force=false){if(templatesLoaded&&!force){renderTemplateTabs();renderTemplates();return}const box=$('template-grid');box.className='asset-loading';box.textContent='模板載入中…';const j=await apiJson('/api/templates?ts='+Date.now(),{cache:'no-store'});templatesData=j.data||{templates:[],categories:['全部','熱門']};templatesLoaded=true;renderTemplateTabs();renderTemplates()}
async function showView(view,btn){currentView=view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view));try{if(view==='orders')await refreshOrders();if(view==='models'||view==='styles')await loadShop();if(view==='assets')await loadAssets();if(view==='templates'){await loadShop();await loadTemplates()}}catch(e){alert(e.message)}}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view,b)));
window.addEventListener('DOMContentLoaded',async()=>{try{await Promise.all([loadShop(),refreshOrders()])}catch(e){console.error(e)}setInterval(()=>{if(currentView==='orders'&&!document.hidden)refreshOrders()},60000)});
async function refreshOrders(force=false){if(ordersBusy&&!force)return;ordersBusy=true;const body=$('orders-body');if(force)body.innerHTML='<tr><td colspan="5" class="loading">重新整理中…</td></tr>';try{const j=await apiJson('/api/admin/get_orders?limit=50&ts='+Date.now(),{cache:'no-store'});const rows=j.data||[];if(!rows.length){body.innerHTML='<tr><td colspan="5" class="empty">目前沒有訂單</td></tr>';return}body.innerHTML=rows.map(o=>{const total=Number(o.total||((o.price||0)*(o.quantity||1)));return `<tr><td><b>${esc(o.order_id)}</b><br><small>${esc(o.customer_name||'')}</small></td><td>${esc(o.model||'')}<br><small>${esc(o.style||'')}｜${esc(o.payment_method||'')}｜${Number(o.quantity||1)}件｜NT$${total.toLocaleString()}</small></td><td>${o.mockup_url?`<img class="order-thumb" loading="lazy" src="${esc(o.mockup_url)}">`:'<span class="bad">無預覽</span>'}</td><td><span class="tag">${esc(o.status||'')}</span></td><td>${o.print_url?`<a class="btn alt mini" href="${esc(o.print_url)}"><i class="fa-solid fa-download"></i> 下載</a>`:'<span class="bad">無檔案</span>'}</td></tr>`}).join('')}catch(e){body.innerHTML=`<tr><td colspan="5" class="bad" style="padding:25px;text-align:center">${esc(e.message)}</td></tr>`}finally{ordersBusy=false}}
function renderBrands(){const box=$('brand-pills');if(!box)return;box.innerHTML=(shopData.brands||[]).map(b=>`<button class="pill">${esc(b)}</button>`).join('')}
function renderModels(){const body=$('models-body');if(!body)return;body.innerHTML=(shopData.models||[]).map(m=>`<tr><td>${esc(m.brand)}</td><td><b>${esc(m.name)}</b></td><td>${(m.preview_mask_img||m.mask_img)?'<span class="ok">✓ 已設定</span>':'<span class="bad">未設定</span>'}</td><td><button class="btn alt mini" onclick="openModelEditor('${esc(m.id)}')">編輯</button><button class="btn danger mini" onclick="deleteModel('${esc(m.id)}')">刪除</button></td></tr>`).join('')}
function renderStyles(){const body=$('styles-body');if(!body)return;body.innerHTML=(shopData.styles||[]).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>NT$ ${Number(s.price||0).toLocaleString()}</td><td>${(s.colors||[]).map(esc).join('、')}</td><td><button class="btn alt mini" onclick="openStyleEditor('${esc(s.id)}')">編輯</button><button class="btn danger mini" onclick="deleteStyle('${esc(s.id)}')">刪除</button></td></tr>`).join('')}
async function saveShop(){await apiJson('/api/admin/save_shop_data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(shopData)})}
async function addBrand(){const name=prompt('輸入品牌名稱');if(!name?.trim())return;const n=name.trim();if((shopData.brands||[]).includes(n))return alert('品牌已存在');shopData.brands.push(n);await saveShop();renderBrands()}
function imgPreview(type,url){$(type+'-url').value=url||'';const img=$(type+'-img');if(img){img.src=url||'';img.style.display=url?'block':'none'}}
function openModelEditor(id=''){const m=id?(shopData.models||[]).find(x=>x.id===id):null;$('model-id').value=id;$('model-brand').innerHTML=(shopData.brands||[]).map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');$('model-brand').value=m?.brand||shopData.brands?.[0]||'';$('model-name').value=m?.name||'';$('model-x').value=m?.print_x??0;$('model-y').value=m?.print_y??0;$('model-w').value=m?.print_w??80;$('model-h').value=m?.print_h??160;imgPreview('model-mask',m?.preview_mask_img||m?.mask_img||'');imgPreview('model-line',m?.print_line_img||m?.line_img||'');openModal('model-modal')}
async function uploadAdminImage(file,type='material'){const fd=new FormData();fd.append('file',file);fd.append('type',type);const r=await apiJson('/api/admin/upload_image',{method:'POST',body:fd});return r.url}
async function uploadModelImage(e,kind){const f=e.target.files?.[0];if(!f)return;try{const url=await uploadAdminImage(f,'material');imgPreview(kind==='mask'?'model-mask':'model-line',url)}catch(err){alert(err.message)}finally{e.target.value=''}}
async function saveModel(){const id=$('model-id').value;const patch={id:id||'m_'+Date.now(),brand:$('model-brand').value,name:$('model-name').value.trim(),preview_mask_img:$('model-mask-url').value,print_line_img:$('model-line-url').value,print_x:Number($('model-x').value)||0,print_y:Number($('model-y').value)||0,print_w:Number($('model-w').value)||80,print_h:Number($('model-h').value)||160,status:true};if(!patch.name)return alert('請填型號名稱');if(id){Object.assign(shopData.models.find(x=>x.id===id),patch)}else shopData.models.push(patch);await saveShop();renderModels();closeModal('model-modal')}
async function deleteModel(id){if(!confirm('確定刪除這個型號？'))return;shopData.models=shopData.models.filter(x=>x.id!==id);await saveShop();renderModels()}
function openStyleEditor(id=''){const s=id?(shopData.styles||[]).find(x=>x.id===id):null;$('style-id').value=id;$('style-name').value=s?.name||'';$('style-price').value=s?.price??390;$('style-colors').value=(s?.colors||[]).join(', ');$('style-x').value=s?.print_x??0;$('style-y').value=s?.print_y??0;$('style-w').value=s?.print_w??80;$('style-h').value=s?.print_h??160;openModal('style-modal')}
async function saveStyle(){const id=$('style-id').value;const prev=id?shopData.styles.find(x=>x.id===id):null;const data={...(prev||{}),id:id||'style_'+Date.now(),name:$('style-name').value.trim(),price:Number($('style-price').value)||390,colors:$('style-colors').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),print_x:Number($('style-x').value)||0,print_y:Number($('style-y').value)||0,print_w:Number($('style-w').value)||80,print_h:Number($('style-h').value)||160,status:true};if(!data.name)return alert('請填材質名稱');if(id)shopData.styles[shopData.styles.findIndex(x=>x.id===id)]=data;else shopData.styles.push(data);await saveShop();renderStyles();closeModal('style-modal')}
async function deleteStyle(id){if(!confirm('確定刪除這個材質？'))return;shopData.styles=shopData.styles.filter(x=>x.id!==id);await saveShop();renderStyles()}
function renderAssetTabs(){const cats=assetsData.categories?.length?assetsData.categories:['全部'];if(!cats.includes(currentAsset))currentAsset=cats[0];$('asset-tabs').innerHTML=cats.map(c=>`<button class="pill ${c===currentAsset?'active':''}" onclick="currentAsset='${esc(c)}';renderAssetTabs();renderAssets()">${esc(c)}</button>`).join('')}
function renderAssets(){const list=currentAsset==='全部'?(assetsData.stickers||[]):(assetsData.stickers||[]).filter(s=>s.category===currentAsset);const box=$('asset-grid');box.className='grid';box.innerHTML=list.length?list.map(s=>`<div class="card"><button class="del" onclick="deleteSticker('${esc(s.id)}')">×</button><img loading="lazy" src="${esc(s.url)}"></div>`).join(''):'<div class="empty">這個分類目前沒有素材</div>'}
async function uploadStickers(e){const fs=[...(e.target.files||[])];if(!fs.length)return;const cat=(prompt('輸入分類','可愛')||'全部').trim()||'全部';const fd=new FormData();fs.forEach(f=>fd.append('files',f));fd.append('category',cat);try{await apiJson('/api/admin/batch_upload_stickers',{method:'POST',body:fd});await loadAssets(true);alert('上傳完成')}catch(err){alert(err.message)}finally{e.target.value=''}}
async function deleteSticker(id){if(!confirm('確定刪除這張貼紙？'))return;await apiJson('/api/admin/delete_sticker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});await loadAssets(true)}
function renderTemplateTabs(){const cats=templatesData.categories?.length?templatesData.categories:['全部','熱門'];if(!cats.includes(currentTpl))currentTpl=cats[0];$('template-tabs').innerHTML=cats.map(c=>`<button class="pill ${c===currentTpl?'active':''}" onclick="currentTpl='${esc(c)}';renderTemplateTabs();renderTemplates()">${esc(c)}</button>`).join('')}
function renderTemplates(){const list=currentTpl==='全部'?(templatesData.templates||[]):(templatesData.templates||[]).filter(t=>t.category===currentTpl);const box=$('template-grid');box.className='grid';box.innerHTML=list.length?list.map(t=>{const m=shopData.models.find(x=>x.id===t.model_id);return `<div class="card"><button class="del" onclick="deleteTemplate('${esc(t.id)}')">×</button><img loading="lazy" src="${esc(t.thumb_url||'')}"><div class="name">${esc(t.name)}</div><small>${esc(m?.name||'未知型號')}</small><div style="margin-top:8px"><button class="btn alt mini" onclick="openTemplateEditor('${esc(t.id)}')">編輯</button></div></div>`}).join(''):'<div class="empty">目前沒有模板</div>'}
function ensureFabric(){if(window.fabric)return Promise.resolve();if(fabricPromise)return fabricPromise;fabricPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('模板編輯器載入失敗，請檢查網路'));document.head.appendChild(s)});return fabricPromise}
async function openTemplateEditor(id=''){try{await Promise.all([loadShop(),loadAssets(),loadTemplates(),ensureFabric()]);const t=id?templatesData.templates.find(x=>x.id===id):null;$('tpl-id').value=id;$('tpl-name').value=t?.name||'';$('tpl-category').value=t?.category||'熱門';$('tpl-model').innerHTML=shopData.models.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');$('tpl-model').value=t?.model_id||shopData.models?.[0]?.id||'';openModal('template-modal');setTimeout(()=>initEditor(t?.slots||[],t?.objects_json||null,t?.thumb_url||''),30)}catch(e){alert(e.message)}}
function initEditor(slots=[],objectsJson=null,fallback=''){if(!window.fabric)return;const id=$('tpl-model').value;if(!id)return;const m=shopData.models.find(x=>x.id===id);const w=Number(m?.print_w)||80,h=Number(m?.print_h)||160;tplW=w*VISUAL_SCALE;tplH=h*VISUAL_SCALE;$('canvas-wrap').style.width=tplW+'px';$('canvas-wrap').style.height=tplH+'px';if(visualCanvas){visualCanvas.dispose();visualCanvas=null}$('tpl-canvas').width=tplW;$('tpl-canvas').height=tplH;visualCanvas=new fabric.Canvas('tpl-canvas',{width:tplW,height:tplH,backgroundColor:'#fff',preserveObjectStacking:true});const draw=()=>drawSlots(slots);if(objectsJson){visualCanvas.loadFromJSON(objectsJson,()=>{visualCanvas.getObjects().forEach(o=>{if(o.isTplBg){o.selectable=false;o.evented=false;visualCanvas.sendToBack(o)}});visualCanvas.renderAll();draw()})}else if(fallback){fabric.Image.fromURL(fallback,img=>{const sc=Math.max(tplW/img.width,tplH/img.height);img.set({left:tplW/2,top:tplH/2,originX:'center',originY:'center',scaleX:sc,scaleY:sc,selectable:false,evented:false,isTplBg:true});visualCanvas.add(img);visualCanvas.sendToBack(img);draw()},{crossOrigin:'anonymous'})}else draw()}
function drawSlots(slots){(slots||[]).forEach(s=>{const r=new fabric.Rect({left:Number(s.x)*VISUAL_SCALE,top:Number(s.y)*VISUAL_SCALE,width:Number(s.w)*VISUAL_SCALE,height:Number(s.h)*VISUAL_SCALE,fill:'rgba(64,158,255,.18)',stroke:'#409EFF',strokeDashArray:[5,5],strokeWidth:2,rx:8,ry:8});r.isSlot=true;r.slotId=s.id||'slot_'+Date.now();visualCanvas.add(r);visualCanvas.bringToFront(r)})}
function addSlot(){if(!visualCanvas)return;const r=new fabric.Rect({left:tplW/2-40,top:tplH/2-40,width:80,height:80,fill:'rgba(64,158,255,.18)',stroke:'#409EFF',strokeDashArray:[5,5],strokeWidth:2,rx:8,ry:8});r.isSlot=true;r.slotId='slot_'+Date.now();visualCanvas.add(r);visualCanvas.setActiveObject(r)}
function addText(){if(!visualCanvas)return;const t=prompt('文字內容','Cute');if(!t)return;const o=new fabric.Textbox(t,{left:tplW/2,top:tplH/2,originX:'center',originY:'center',fontSize:28,fill:'#333',fontWeight:'bold'});visualCanvas.add(o);visualCanvas.setActiveObject(o)}
async function pickSticker(){await loadAssets();const list=assetsData.stickers||[];if(!list.length)return alert('素材庫目前是空的');const names=list.slice(0,30).map((s,i)=>`${i+1}. ${s.category||'貼紙'}`).join('\n');const n=Number(prompt('輸入貼紙編號：\n'+names,'1'));const s=list[n-1];if(!s)return;fabric.Image.fromURL(s.url,img=>{img.scaleToWidth(80);img.set({left:tplW/2,top:tplH/2,originX:'center',originY:'center'});visualCanvas.add(img);visualCanvas.setActiveObject(img)},{crossOrigin:'anonymous'})}
function deleteEditorObject(){const o=visualCanvas?.getActiveObject();if(o)visualCanvas.remove(o)}
async function uploadTemplateBg(e){const f=e.target.files?.[0];if(!f||!visualCanvas)return;try{const url=await uploadAdminImage(f,'template');visualCanvas.getObjects().filter(o=>o.isTplBg).forEach(o=>visualCanvas.remove(o));fabric.Image.fromURL(url,img=>{const sc=Math.max(tplW/img.width,tplH/img.height);img.set({left:tplW/2,top:tplH/2,originX:'center',originY:'center',scaleX:sc,scaleY:sc,selectable:false,evented:false,isTplBg:true});visualCanvas.add(img);visualCanvas.sendToBack(img);visualCanvas.renderAll()},{crossOrigin:'anonymous'})}catch(err){alert(err.message)}finally{e.target.value=''}}
async function saveTemplate(){const id=$('tpl-id').value,name=$('tpl-name').value.trim(),category=$('tpl-category').value.trim()||'熱門',model_id=$('tpl-model').value;if(!name||!model_id||!visualCanvas)return alert('請填名稱並選型號');const slots=[],slotObjs=[];visualCanvas.getObjects().forEach(o=>{if(o.isSlot){slots.push({id:o.slotId||'slot_'+Date.now(),x:o.left/VISUAL_SCALE,y:o.top/VISUAL_SCALE,w:o.width*o.scaleX/VISUAL_SCALE,h:o.height*o.scaleY/VISUAL_SCALE});slotObjs.push(o)}});visualCanvas.discardActiveObject();slotObjs.forEach(o=>o.set('opacity',0));visualCanvas.renderAll();const dataUrl=visualCanvas.toDataURL({format:'png',multiplier:2});slotObjs.forEach(o=>o.set('opacity',1));visualCanvas.renderAll();const objects=visualCanvas.toJSON(['isSlot','isTplBg','slotId']);objects.objects=(objects.objects||[]).filter(o=>!o.isSlot);try{const blob=await (await fetch(dataUrl)).blob();const url=await uploadAdminImage(new File([blob],'template.png',{type:'image/png'}),'template');const data={id:id||'tpl_'+Date.now(),name,category,model_id,thumb_url:url,slots,objects_json:objects};if(id){const i=templatesData.templates.findIndex(x=>x.id===id);templatesData.templates[i]=data}else templatesData.templates.push(data);if(!templatesData.categories.includes(category))templatesData.categories.push(category);await apiJson('/api/admin/save_templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(templatesData)});renderTemplateTabs();renderTemplates();closeModal('template-modal')}catch(e){alert('模板儲存失敗：'+e.message)}}
async function deleteTemplate(id){if(!confirm('確定刪除這個模板？'))return;templatesData.templates=templatesData.templates.filter(x=>x.id!==id);await apiJson('/api/admin/save_templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(templatesData)});renderTemplates()}
</script>
