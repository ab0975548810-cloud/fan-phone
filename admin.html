<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>來火定制 - 後台管理系統</title>
    <!-- 使用 FontAwesome 處理圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基礎樣式與 Element UI 風格還原 */
        :root {
            --primary-color: #409EFF; /* 經典 Element 藍 */
            --bg-color: #f0f2f5;
            --sidebar-bg: #ffffff;
            --text-main: #303133;
            --text-regular: #606266;
            --border-color: #EBEEF5;
            --danger-color: #F56C6C;
        }
        body { margin: 0; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微軟雅黑", Arial, sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* === 左側導航列 (Sidebar) === */
        .sidebar { width: 220px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
        .logo-area { height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-color); color: #d32f2f; font-weight: bold; font-size: 20px; }
        .logo-area i { font-size: 24px; margin-bottom: 4px; }
        
        .menu-list { flex: 1; overflow-y: auto; padding-top: 10px; }
        .menu-item { padding: 15px 20px; font-size: 14px; color: var(--text-main); cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; }
        .menu-item:hover { background: #f5f7fa; }
        .menu-item.active { background: #ecf5ff; color: var(--primary-color); border-left-color: var(--primary-color); }
        
        /* === 右側主內容區 (Main Content) === */
        .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .top-header { height: 50px; background: white; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 13px; color: var(--text-regular); }
        .header-links a { color: var(--primary-color); text-decoration: none; margin-left: 15px; }
        
        .content-area { flex: 1; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        
        /* === 內容區塊共用元件 === */
        .page-title { font-size: 18px; font-weight: bold; margin-top: 0; margin-bottom: 20px; }
        .panel { background: white; border-radius: 4px; border: 1px solid var(--border-color); padding: 20px; }
        
        /* 標籤頁 (Tabs) */
        .tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; }
        .tab { padding: 10px 20px; font-size: 14px; cursor: pointer; color: var(--text-main); margin-bottom: -2px; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); font-weight: bold; }
        
        /* 按鈕 (Buttons) */
        .el-btn { display: inline-block; background: var(--primary-color); color: white; border: none; padding: 9px 15px; font-size: 12px; border-radius: 3px; cursor: pointer; transition: 0.1s; }
        .el-btn:hover { background: #66b1ff; }
        .el-btn.danger { background: white; color: var(--danger-color); border: 1px solid #fbc4c4; }
        .el-btn.danger:hover { background: #fef0f0; }
        
        /* 表格 (Table) */
        .el-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        .el-table th { background: #f5f7fa; color: #909399; font-weight: normal; padding: 12px; border-bottom: 1px solid var(--border-color); }
        .el-table td { padding: 12px; border-bottom: 1px solid var(--border-color); color: var(--text-regular); }
        .el-table tr:hover { background: #f5f7fa; }
        
        /* 開關 (Switch) */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* 隱藏區塊 */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* 彈窗 (Modal) */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 100; display: none; justify-content:center; align-items:center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; width: 400px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border-color); text-align: right; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 8px; color: var(--text-main); }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 4px; box-sizing: border-box; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary-color); }
    </style>
</head>
<body>

    <!-- 左側導航 -->
    <div class="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-hammer"></i>
            <div>來火定制</div>
        </div>
        <div class="menu-list">
            <div class="menu-item" onclick="switchMenu('orders')">訂單管理</div>
            <div class="menu-item active" onclick="switchMenu('models')">手機品牌及型號</div>
            <div class="menu-item" onclick="switchMenu('styles')">手機殼材質</div>
            <div class="menu-item" onclick="switchMenu('assets')">素材庫</div>
            <div class="menu-item" onclick="switchMenu('templates')">模板庫</div>
        </div>
    </div>

    <!-- 右側主內容 -->
    <div class="main-container">
        <!-- 頂部列 -->
        <div class="top-header">
            <div></div>
            <div class="header-links">
                <span>15602902808</span>
                <a href="#">幫助文檔</a>
                <a href="#">聯繫客服</a>
                <a href="/" target="_blank" style="color: #67c23a;">查看前台</a>
            </div>
        </div>

        <!-- 內容區 -->
        <div class="content-area">
            
            <!-- 模組：手機品牌及型號 -->
            <div id="view-models" class="view-section active">
                <h2 class="page-title">手機品牌及型號</h2>
                <div class="panel">
                    <div class="tabs">
                        <div class="tab active" onclick="switchTab('brand-tab', 'model-tab')">品牌列表</div>
                        <div class="tab" onclick="switchTab('model-tab', 'brand-tab')">型號列表</div>
                    </div>
                    
                    <!-- 品牌列表區 -->
                    <div id="brand-tab" style="display: block;">
                        <button class="el-btn" style="margin-bottom: 15px;" onclick="openModal('brand-modal')">新增品牌</button>
                        <table class="el-table">
                            <thead><tr><th width="50">序號</th><th>品牌</th><th>狀態</th><th width="100">操作</th></tr></thead>
                            <tbody id="brand-table-body">
                                <!-- JS 動態渲染 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 型號列表區 -->
                    <div id="model-tab" style="display: none;">
                        <button class="el-btn" style="margin-bottom: 15px;" onclick="openModal('model-modal')">新增型號</button>
                        <table class="el-table">
                            <thead><tr><th width="50">序號</th><th>所屬品牌</th><th>型號 ID</th><th>型號名稱</th><th>狀態</th><th width="150">操作</th></tr></thead>
                            <tbody id="model-table-body">
                                <!-- JS 動態渲染 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 模組：未完成的預留頁面 -->
            <div id="view-orders" class="view-section"><h2 class="page-title">訂單管理</h2><div class="panel">功能開發中...</div></div>
            <div id="view-styles" class="view-section"><h2 class="page-title">手機殼材質</h2><div class="panel">功能開發中...</div></div>
            <div id="view-assets" class="view-section"><h2 class="page-title">素材庫</h2><div class="panel">功能開發中...</div></div>
            <div id="view-templates" class="view-section"><h2 class="page-title">模板庫</h2><div class="panel">功能開發中...</div></div>

        </div>
    </div>

    <!-- 彈窗：新增品牌 -->
    <div class="modal-overlay" id="brand-modal">
        <div class="modal-box">
            <div class="modal-header"><span>新增品牌</span><button class="el-btn danger" style="padding:2px 6px; border:none;" onclick="closeModal('brand-modal')"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <div class="form-group"><label>品牌名稱</label><input type="text" id="input-brand-name" class="form-control" placeholder="例如：蘋果"></div>
            </div>
            <div class="modal-footer">
                <button class="el-btn danger" onclick="closeModal('brand-modal')">取消</button>
                <button class="el-btn" onclick="saveNewBrand()">確定</button>
            </div>
        </div>
    </div>

    <!-- 彈窗：新增型號 -->
    <div class="modal-overlay" id="model-modal">
        <div class="modal-box">
            <div class="modal-header"><span>新增型號</span><button class="el-btn danger" style="padding:2px 6px; border:none;" onclick="closeModal('model-modal')"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="modal-body">
                <div class="form-group">
                    <label>選擇品牌</label>
                    <select id="input-model-brand" class="form-control"></select>
                </div>
                <div class="form-group"><label>型號 ID (英文小寫，例如 ip18)</label><input type="text" id="input-model-id" class="form-control" placeholder="需為唯一值"></div>
                <div class="form-group"><label>型號名稱 (顯示用)</label><input type="text" id="input-model-name" class="form-control" placeholder="例如：iPhone 18"></div>
            </div>
            <div class="modal-footer">
                <button class="el-btn danger" onclick="closeModal('model-modal')">取消</button>
                <button class="el-btn" onclick="saveNewModel()">確定</button>
            </div>
        </div>
    </div>

<script>
    let shopData = { brands: [], models: [], styles: [] };

    // 初始化：讀取伺服器資料
    window.onload = async () => {
        try {
            const res = await fetch('/api/shop_data');
            const data = await res.json();
            if(data.status === "success") {
                shopData = data.data;
                renderBrands();
                renderModels();
            }
        } catch(e) { alert("讀取資料失敗"); }
    };

    // === UI 切換邏輯 ===
    function switchMenu(viewId) {
        document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
    }

    function switchTab(showId, hideId) {
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById(showId).style.display = 'block';
        document.getElementById(hideId).style.display = 'none';
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // === 渲染表格 ===
    function renderBrands() {
        const tbody = document.getElementById('brand-table-body');
        const select = document.getElementById('input-model-brand');
        tbody.innerHTML = ''; select.innerHTML = '';
        
        shopData.brands.forEach((brand, idx) => {
            // 表格
            tbody.innerHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${brand}</td>
                    <td><label class="switch"><input type="checkbox" checked disabled><span class="slider"></span></label></td>
                    <td><button class="el-btn danger" onclick="deleteBrand('${brand}')">刪除</button></td>
                </tr>
            `;
            // 型號新增彈窗的下拉選單
            select.innerHTML += `<option value="${brand}">${brand}</option>`;
        });
    }

    function renderModels() {
        const tbody = document.getElementById('model-table-body');
        tbody.innerHTML = '';
        
        shopData.models.forEach((model, idx) => {
            const checked = model.status !== false ? 'checked' : '';
            tbody.innerHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${model.brand}</td>
                    <td>${model.id}</td>
                    <td>${model.name}</td>
                    <td><label class="switch"><input type="checkbox" ${checked} onchange="toggleModelStatus('${model.id}', this.checked)"><span class="slider"></span></label></td>
                    <td><button class="el-btn danger" onclick="deleteModel('${model.id}')">刪除</button></td>
                </tr>
            `;
        });
    }

    // === 資料操作與儲存 ===
    async function syncToServer() {
        try {
            const res = await fetch('/api/admin/save_shop_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(shopData)
            });
            const result = await res.json();
            if(!res.ok) alert("儲存失敗：" + result.msg);
        } catch(e) { alert("連線錯誤"); }
    }

    function saveNewBrand() {
        const name = document.getElementById('input-brand-name').value.trim();
        if(!name) return alert("請輸入品牌名稱");
        if(shopData.brands.includes(name)) return alert("品牌已存在");
        
        shopData.brands.push(name);
        syncToServer();
        renderBrands();
        closeModal('brand-modal');
        document.getElementById('input-brand-name').value = '';
    }

    function saveNewModel() {
        const brand = document.getElementById('input-model-brand').value;
        const id = document.getElementById('input-model-id').value.trim();
        const name = document.getElementById('input-model-name').value.trim();
        
        if(!id || !name) return alert("資料不可為空");
        if(shopData.models.find(m => m.id === id)) return alert("型號 ID 已存在，請換一個");
        
        shopData.models.push({ id, brand, name, status: true });
        syncToServer();
        renderModels();
        closeModal('model-modal');
        document.getElementById('input-model-id').value = '';
        document.getElementById('input-model-name').value = '';
    }

    function toggleModelStatus(id, isChecked) {
        const model = shopData.models.find(m => m.id === id);
        if(model) {
            model.status = isChecked;
            syncToServer();
        }
    }

    function deleteBrand(brandName) {
        if(!confirm(`確定要刪除品牌 [${brandName}] 嗎？`)) return;
        shopData.brands = shopData.brands.filter(b => b !== brandName);
        syncToServer();
        renderBrands();
    }

    function deleteModel(modelId) {
        if(!confirm(`確定要刪除型號 ID [${modelId}] 嗎？`)) return;
        shopData.models = shopData.models.filter(m => m.id !== modelId);
        syncToServer();
        renderModels();
    }
</script>
</body>
</html>
