name: AI Editor WebKit

on:
  pull_request:
    branches: [ main ]

jobs:
  webkit-ai-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps webkit
      - name: Run WebKit AI/editor regression test
        run: python .github/tests/test_ai_editor_webkit.py
