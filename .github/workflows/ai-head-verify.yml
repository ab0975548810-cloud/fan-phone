name: AI Head Browser Verify

on:
  push:
    branches: [ai-head-verify-20260916]
  workflow_dispatch:

jobs:
  webkit-ai-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app + browser test dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps webkit
      - name: Run existing smoke test
        env:
          FLASK_SECRET_KEY: ai-head-verify-secret
          SESSION_COOKIE_SECURE: 'false'
        run: python smoke_test.py
      - name: Run real WebKit MediaPipe segmentation test
        id: browser_test
        continue-on-error: true
        env:
          FLASK_SECRET_KEY: ai-head-verify-secret
          SESSION_COOKIE_SECURE: 'false'
        run: |
          set -o pipefail
          python ai_head_integration_test.py 2>&1 | tee ai-head-test.log
      - name: Upload browser verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-head-webkit-log
          path: ai-head-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail when WebKit verification failed
        if: steps.browser_test.outcome == 'failure'
        run: exit 1
