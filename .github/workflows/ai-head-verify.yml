name: AI Head Browser Verify

on:
  push:
    branches: [ai-head-verify-20260916]
  workflow_dispatch:

jobs:
  webkit-ai-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app + browser test dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps webkit
      - name: Run existing smoke test
        env:
          FLASK_SECRET_KEY: ai-head-verify-secret
          SESSION_COOKIE_SECURE: 'false'
        run: python smoke_test.py
      - name: Run real WebKit MediaPipe segmentation test
        env:
          FLASK_SECRET_KEY: ai-head-verify-secret
          SESSION_COOKIE_SECURE: 'false'
        run: python ai_head_integration_test.py
