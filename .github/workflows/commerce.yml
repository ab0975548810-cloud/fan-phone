name: Commerce Transactions
on:
  pull_request:
    branches: [main]
jobs:
  transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'psycopg[binary]==3.2.12'
      - name: SQLite transaction and multi-process regression
        run: |
          python test_catalog_concurrency.py
          python test_commerce.py
          python test_print_center.py
      - name: PostgreSQL schema, privileges, rollback and concurrency
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:test-only@localhost:5432/commerce_test
        run: |
          python .github/tests/setup_commerce_postgres.py
          python test_commerce.py
