name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run storefront/admin smoke test
        env:
          FLASK_SECRET_KEY: smoke-test-secret-only
          SESSION_COOKIE_SECURE: 'false'
        run: python smoke_test.py
      - name: Run Passkey security regression
        env:
          FLASK_SECRET_KEY: passkey-test-secret-only
        run: python test_passkey_auth.py
