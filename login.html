<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>管理後台登入｜本福丸訂製</title>
  <style>
    :root{--pink:#ff6f9a;--pink-dark:#e95683;--soft:#fff5f7;--line:#f2dce4;--ink:#352e32;--muted:#82767c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);background:var(--soft)}
    body{min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(390px,100%);background:#fff;padding:32px 26px;border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 45px rgba(185,72,111,.13);text-align:center}
    .mark{width:54px;height:54px;margin:0 auto 14px;border-radius:18px;background:#fff0f5;color:var(--pink);display:grid;place-items:center;font-size:26px;font-weight:900}.card h1{font-size:21px;margin:0 0 7px;color:var(--pink-dark)}.lead{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 22px}
    button,input{font:inherit}.primary,.secondary{width:100%;min-height:48px;border-radius:999px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--pink);color:#fff;box-shadow:0 8px 20px rgba(255,111,154,.25)}.primary:disabled{opacity:.55;cursor:wait}.secondary{margin-top:10px;background:#fff;border:1px solid #edb8c9;color:var(--pink-dark)}
    .password{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.password.show{display:block}.password input{width:100%;padding:13px 14px;border:1px solid #e9d8de;border-radius:13px;outline:none;margin-bottom:10px}.password input:focus{border-color:var(--pink)}
    .message{min-height:21px;margin:13px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}.message.error{color:#c9485f}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">♡</div>
    <h1>本福丸訂製管理後台</h1>
    <p class="lead">已啟用的 iPhone 或 iPad，可用 Passkey 透過 Face ID 安全登入。</p>
    <section id="passkey-login">
      <button id="passkey-login-button" class="primary" type="button">使用 Face ID 登入</button>
      <button id="password-toggle" class="secondary" type="button" aria-expanded="false">使用密碼登入</button>
      <p id="login-message" class="message" role="status" aria-live="polite"></p>
    </section>
    <form id="password-form" class="password" method="POST">
      <input type="password" name="password" placeholder="請輸入密碼" autocomplete="current-password" required>
      <button class="primary" type="submit">使用密碼登入</button>
    </form>
  </main>
  <script src="/static/passkey-client.js?v=20260925a"></script>
</body>
</html>
