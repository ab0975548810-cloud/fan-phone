<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客製化手機殼 - 完美遮罩版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { --bg-color: #f7f7f7; --primary-color: #ff6a48; --text-main: #333333; --panel-bg: #ffffff; --border-color: #eeeeee; }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        .app-container { width: 100%; max-width: 500px; background: var(--bg-color); display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden; }
        .page { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.2s ease; position: absolute; top:0; left:0; width:100%; background: var(--bg-color); }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .top-nav { height: 50px; background: var(--panel-bg); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; }
        .nav-btn { background: none; border: none; font-size: 18px; color: var(--text-main); cursor: pointer; }
        .title { font-weight: 600; font-size: 16px; }
        .content { flex: 1; overflow-y: auto; padding: 15px; }
        
        .search-box-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; background: #eee; border: none; border-radius: 20px; padding: 10px 15px; font-size: 14px; outline: none; }
        .search-btn { background: var(--primary-color); color: white; border: none; border-radius: 20px; padding: 0 20px; font-weight: bold; cursor: pointer; }
        
        .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .model-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 10px; text-align: center; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .model-card:hover, .model-card.selected { border-color: var(--primary-color); background: #fff5f2; color: var(--primary-color); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: none; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; max-height: 85vh; overflow-y: auto; }
        
        .option-group { margin-bottom: 20px; }
        .option-title { font-weight: bold; font-size: 14px; margin-bottom: 10px; color: #555; }
        .option-chips { display: flex; flex-wrap: wrap; gap: 10px; }
        .chip { padding: 8px 15px; background: #f0f0f0; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid transparent; }
        .chip.selected { background: #fff5f2; border-color: var(--primary-color); color: var(--primary-color); font-weight: bold; }
        
        .primary-btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 15px; box-shadow: 0 4px 10px rgba(255,106,72,0.3); }
        
        .mode-switch-bar { height: 75px; background: white; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 10; }
        .mode-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; color: #666; }
        .mode-tab i { font-size: 22px; }
        .mode-tab.active { color: var(--primary-color); font-weight: bold; }
        
        .template-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding-bottom: 20px; }
        .template-item { background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; padding: 10px; text-align: center; }
        .template-item img { width: 100%; height: 160px; object-fit: contain; background: #f0f0f0; border-radius: 8px; }
        
        .workspace { flex: 1; background: #e2e4e9; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .canvas-container-wrapper { width: 240px; height: 480px; background: white; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); position: relative; overflow: hidden; }
        
        /* 讓遮罩完美覆蓋在畫布最上方，且本身帶有白底或實色邊界，阻擋溢出 */
        .phone-mask-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; object-fit: contain; background: transparent; }
        
        .bottom-panel { background: var(--panel-bg); border-top: 1px solid var(--border-color); z-index: 10; }
        .toolbar { display: flex; justify-content: space-around; padding: 10px; }
        .tool-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; min-width: 60px; color: var(--text-main); cursor: pointer; font-size: 11px; }
        .tool-btn i { font-size: 20px; color: #555; }
        
        .drawer { position: absolute; bottom: -100%; left: 0; width: 100%; height: 260px; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); transition: bottom 0.3s ease; z-index: 20; display: flex; flex-direction: column; }
        .drawer.active { bottom: 0; }
        .drawer-header { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #eee; font-weight: bold; }
        .drawer-content { flex: 1; overflow-y: auto; padding: 15px; }
        .close-drawer { background: none; border: none; font-size: 18px; cursor: pointer; color: #888; }
        
        .sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .sticker-card { background: #f9f9f9; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; height: 80px; display: flex; align-items: center; justify-content: center; }
        .sticker-card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 15; display: none; }
        .overlay.active { display: block; }
    </style>
</head>
<body>
<div class="app-container">

    <div id="page-model" class="page active">
        <div class="top-nav">
            <button class="nav-btn"></button>
            <div class="title">選擇型號</div>
            <button class="nav-btn" style="font-size: 14px; color:#888;" onclick="alert('請選擇型號')">說明</button>
        </div>
        <div class="content">
            <div class="search-box-container">
                <input type="text" id="model-search" class="search-input" placeholder="搜索型號" oninput="filterModels()">
                <button class="search-btn" onclick="filterModels()">搜索</button>
            </div>
            <h4 style="margin: 10px 0; color:var(--primary-color);">支援型號列表</h4>
            <div class="model-grid" id="auto-model-grid">
                <div style="grid-column:span 2; text-align:center; color:#888;">正在讀取型號...</div>
            </div>
        </div>
    </div>

    <div id="page-templates" class="page">
        <div class="top-nav">
            <button class="nav-btn" onclick="goToPage('page-model')"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="title">選擇你喜歡的模板</div>
            <button class="nav-btn" style="font-size:12px; color:var(--primary-color);" onclick="openSpecModal()">規格</button>
        </div>
        <div class="content">
            <div style="font-size: 13px; color: #666; margin-bottom: 15px; text-align: center;" id="selected-spec-info">已選擇型號</div>
            <div class="template-grid">
                <div class="template-item" onclick="loadTemplate('https://wsrv.nl/?url=https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400&q=80')">
                    <img src="https://wsrv.nl/?url=https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400&q=80">
                    <div style="font-size:12px; margin-top:8px; font-weight:bold;">可愛萌寵範本</div>
                </div>
            </div>
        </div>
        <div class="mode-switch-bar">
            <div class="mode-tab active" onclick="goToPage('page-templates')">
                <i class="fa-solid fa-store" style="color:var(--primary-color);"></i>
                <span>店鋪推薦</span>
            </div>
            <div class="mode-tab" onclick="startPureDIY()">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>自主DIY</span>
            </div>
        </div>
    </div>

    <div id="page-editor" class="page">
        <div class="top-nav">
            <button class="nav-btn" onclick="goToPage('page-templates')"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="title">DIY 你的作品</div>
            <button class="nav-btn" style="background:var(--primary-color); color:white; padding: 6px 14px; border-radius: 15px; font-size: 13px;" onclick="exportOrder()">完成</button>
        </div>
        
        <div class="workspace">
            <div class="canvas-container-wrapper">
                <canvas id="main-canvas"></canvas>
                <img id="real-phone-mask" class="phone-mask-img" src="" alt="">
            </div>
            
            <div class="overlay" id="overlay" onclick="closeDrawers()"></div>
            
            <div class="drawer" id="drawer-sticker">
                <div class="drawer-header"><span>選擇貼紙</span><button class="close-drawer" onclick="closeDrawers()"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="drawer-content">
                    <div class="sticker-grid">
                        <div class="sticker-card" onclick="addSticker('https://images.unsplash.com/photo-1534361960057-19889db9621e?w=200&q=80')"><img src="https://images.unsplash.com/photo-1534361960057-19889db9621e?w=200&q=80"></div>
                    </div>
                </div>
            </div>

            <div class="drawer" id="drawer-text">
                <div class="drawer-header"><span>添加文字</span><button class="close-drawer" onclick="closeDrawers()"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="drawer-content">
                    <input type="text" id="input-text-val" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:10px;" placeholder="請輸入文字...">
                    <button class="primary-btn" onclick="addCustomText()">確認加入</button>
                </div>
            </div>
            
            <input type="file" id="file-uploader" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>

        <div class="bottom-panel">
            <div class="toolbar">
                <button class="tool-btn" onclick="document.getElementById('file-uploader').click()"><i class="fa-solid fa-image" style="color:var(--primary-color);"></i><span>上傳圖片</span></button>
                <button class="tool-btn" onclick="openDrawer('drawer-sticker')"><i class="fa-solid fa-face-smile" style="color:#ffbc00;"></i><span>貼紙</span></button>
                <button class="tool-btn" onclick="openDrawer('drawer-text')"><i class="fa-solid fa-t" style="color:#2ecc71;"></i><span>文字</span></button>
                <button class="tool-btn" onclick="deleteActiveObject()" style="color:red;"><i class="fa-solid fa-trash" style="color:red;"></i><span>刪除</span></button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="spec-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items:center; margin-bottom: 15px;">
                <h3 style="margin:0; font-size: 16px;" id="modal-model-title">選擇規格</h3>
                <button onclick="closeSpecModal()" style="background:none; border:none; font-size:18px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="option-group">
                <div class="option-title">材質類型</div>
                <div class="option-chips">
                    <div class="chip selected" onclick="selectChip(this)">撞色邊框磁吸殼</div>
                </div>
            </div>
            <button class="primary-btn" onclick="confirmSpecAndNext()">確定</button>
        </div>
    </div>

</div>

<script>
    let allModels = [];
    let selectedModelFile = "";
    let selectedModelName = "";
    let canvas;

    window.onload = async () => {
        try {
            const res = await fetch('/api/get_models');
            const data = await res.json();
            allModels = data.models || [];
            renderModelGrid(allModels);
        } catch(e) {
            document.getElementById('auto-model-grid').innerHTML = '<div style="grid-column:span 2; text-align:center; color:red;">無法載入型號清單</div>';
        }
    };

    function renderModelGrid(models) {
        const grid = document.getElementById('auto-model-grid');
        grid.innerHTML = '';
        if(models.length === 0) {
            grid.innerHTML = '<div style="grid-column:span 2; text-align:center; color:red;">static 資料夾內沒有圖片！</div>';
            return;
        }
        models.forEach(m => {
            const card = document.createElement('div');
            card.className = 'model-card';
            card.innerText = m.name;
            card.onclick = () => chooseModel(m.filename, m.name);
            grid.appendChild(card);
        });
    }

    function filterModels() {
        const keyword = document.getElementById('model-search').value.toLowerCase();
        const filtered = allModels.filter(m => m.name.toLowerCase().includes(keyword));
        renderModelGrid(filtered);
    }

    function chooseModel(filename, name) {
        selectedModelFile = filename;
        selectedModelName = name;
        document.getElementById('modal-model-title').innerText = "已選：" + name;
        document.getElementById('spec-modal').classList.add('active');
    }

    function closeSpecModal() { document.getElementById('spec-modal').classList.remove('active'); }
    function selectChip(el) { el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected')); el.classList.add('selected'); }

    function confirmSpecAndNext() {
        closeSpecModal();
        document.getElementById('selected-spec-info').innerText = `已選擇：${selectedModelName}`;
        
        const safeFileName = encodeURIComponent(selectedModelFile);
        const maskImg = document.getElementById('real-phone-mask');
        maskImg.style.display = 'block';
        maskImg.src = "/static/" + safeFileName;
        
        goToPage('page-templates');
    }

    function openSpecModal() { document.getElementById('spec-modal').classList.add('active'); }
    function goToPage(pageId) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(pageId).classList.add('active'); }
    function startPureDIY() { goToPage('page-editor'); initCanvas(); }

    function loadTemplate(imgUrl) {
        goToPage('page-editor');
        initCanvas();
        fabric.Image.fromURL(imgUrl, img => {
            const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
            img.set({ originX: 'center', originY: 'center', left: canvas.width / 2, top: canvas.height / 2, scaleX: scale, scaleY: scale });
            canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
        }, { crossOrigin: 'anonymous' });
    }

    function initCanvas() {
        if(canvas) return;
        canvas = new fabric.Canvas('main-canvas', { width: 240, height: 480, backgroundColor: '#ffffff' });
    }

    function openDrawer(id) { document.getElementById('overlay').classList.add('active'); document.getElementById(id).classList.add('active'); }
    function closeDrawers() { document.getElementById('overlay').classList.remove('active'); document.querySelectorAll('.drawer').forEach(d => d.classList.remove('active')); }

    function handleImageUpload(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(f) {
            fabric.Image.fromURL(f.target.result, img => {
                img.scaleToWidth(150);
                canvas.add(img);
                canvas.setActiveObject(img);
            });
        };
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    function addSticker(url) {
        closeDrawers();
        fabric.Image.fromURL(url, img => {
            img.scaleToWidth(100);
            canvas.add(img);
            canvas.setActiveObject(img);
        }, { crossOrigin: 'anonymous' });
    }

    function addCustomText() {
        const txt = document.getElementById('input-text-val').value;
        if(!txt) return;
        closeDrawers();
        const textObj = new fabric.Textbox(txt, { left: 40, top: 150, fontSize: 24, fill: '#333' });
        canvas.add(textObj);
        canvas.setActiveObject(textObj);
        document.getElementById('input-text-val').value = '';
    }

    function deleteActiveObject() {
        const activeObj = canvas.getActiveObject();
        if(activeObj) canvas.remove(activeObj);
    }

    async function exportOrder() {
        if(!canvas) return;
        canvas.discardActiveObject();
        canvas.renderAll();
        const printBase64 = canvas.toDataURL({ format: 'png', multiplier: 2 });
        alert("🔄 正在生成訂單...");

        const maskImgEl = document.getElementById('real-phone-mask');
        fabric.Image.fromURL(maskImgEl.src, async function(maskImg) {
            maskImg.set({ left: 0, top: 0, width: 240, height: 480, selectable: false });
            canvas.add(maskImg);
            canvas.renderAll();
            const mockupBase64 = canvas.toDataURL({ format: 'png', multiplier: 2 });
            canvas.remove(maskImg);
            canvas.renderAll();

            try {
                const res = await fetch('/api/create_order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ print_file: printBase64, mockup_file: mockupBase64 })
                });
                const result = await res.json();
                if(res.ok) alert("✅ 訂單已送出，圖片已存入 orders！");
                else alert("⚠️ 錯誤：" + result.msg);
            } catch(err) {
                alert("❌ 連線錯誤！");
            }
        }, { crossOrigin: 'anonymous' });
    }
</script>
</body>
</html>
