<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客製化手機殼 - 首頁</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary-color: #ff6a48; /* 主題珊瑚粉 */
            --bg-color: #fcfcfc; 
            --text-main: #333333; 
            --text-muted: #888888;
            --border-color: #eeeeee; 
            --card-bg: #ffffff;
        }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .app-container { width: 100%; max-width: 500px; background: var(--bg-color); display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        /* 頁面切換動畫 */
        .page { display: none; flex-direction: column; height: 100%; position: absolute; top:0; left:0; width:100%; background: var(--bg-color); animation: slideIn 0.3s ease forwards; }
        .page.active { display: flex; }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* 頂部導航列 */
        .top-nav { height: 55px; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; }
        .nav-btn { background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; padding: 5px; }
        .title { font-weight: 700; font-size: 17px; letter-spacing: 0.5px; }
        
        /* 內容區塊 */
        .content { flex: 1; overflow-y: auto; padding: 0; display: flex; flex-direction: column; }
        
        /* 品牌標籤 (Apple, Samsung...) */
        .brand-tabs { display: flex; overflow-x: auto; padding: 15px 20px 5px 20px; gap: 20px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); white-space: nowrap; scrollbar-width: none; }
        .brand-tabs::-webkit-scrollbar { display: none; }
        .brand-tab { font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; padding-bottom: 10px; border-bottom: 3px solid transparent; transition: 0.2s; }
        .brand-tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        
        /* 型號列表 */
        .model-list-container { padding: 20px; display: flex; gap: 15px; }
        .brand-sidebar { width: 60px; font-weight: bold; color: var(--primary-color); font-size: 14px; padding-top: 10px; }
        .model-grid { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start; }
        .model-btn { background: #f5f6f8; border: 1px solid transparent; border-radius: 12px; padding: 14px 10px; text-align: center; font-size: 14px; font-weight: 500; color: var(--text-main); cursor: pointer; transition: 0.2s; }
        .model-btn.selected { background: #fff5f2; border-color: var(--primary-color); color: var(--primary-color); font-weight: bold; }
        
        /* 款式列表 */
        .style-list { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .style-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
        .style-card.selected { border-color: var(--primary-color); background: #fffaf9; box-shadow: 0 4px 12px rgba(255,106,72,0.1); }
        .style-img-placeholder { width: 60px; height: 120px; background: #eee; border-radius: 8px; border: 1px solid #ddd; }
        .style-info { flex: 1; }
        .style-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .style-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
        .style-price { font-size: 15px; font-weight: 700; color: var(--primary-color); }
        
        /* 底部固定按鈕 */
        .bottom-bar { padding: 15px 20px; background: var(--card-bg); border-top: 1px solid var(--border-color); }
        .primary-btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 16px; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; box-shadow: 0 4px 15px rgba(255,106,72,0.3); transition: transform 0.1s; }
        .primary-btn:active { transform: scale(0.98); }
        .primary-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="app-container">

    <!-- 頁面 1：選擇手機型號 -->
    <div id="page-select-model" class="page active">
        <div class="top-nav">
            <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="title">選擇手機型號</div>
            <div style="width: 24px;"></div> <!-- 佔位對齊用 -->
        </div>
        
        <!-- 動態品牌標籤 -->
        <div class="brand-tabs" id="brand-tabs">
            <div class="brand-tab active">載入中...</div>
        </div>

        <div class="content">
            <div class="model-list-container">
                <div class="brand-sidebar" id="current-brand-label">Brand</div>
                <div class="model-grid" id="model-grid">
                    <!-- 型號按鈕由 JS 動態生成 -->
                </div>
            </div>
        </div>
        
        <div class="bottom-bar">
            <button class="primary-btn" id="btn-next-to-style" disabled onclick="goToPage('page-select-style')">下一步：選擇款式</button>
        </div>
    </div>

    <!-- 頁面 2：選擇手機殼款式 -->
    <div id="page-select-style" class="page">
        <div class="top-nav">
            <button class="nav-btn" onclick="goToPage('page-select-model')"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="title">選擇手機殼款式</div>
            <div style="width: 24px;"></div>
        </div>
        
        <div class="content" style="background: #f5f6f8;">
            <div style="padding: 15px 20px 0 20px; font-size: 14px; color: var(--text-muted); font-weight: bold;">
                已選型號：<span id="display-selected-model" style="color: var(--primary-color);"></span>
            </div>
            
            <div class="style-list" id="style-list">
                <!-- 款式卡片由 JS 動態生成 -->
            </div>
        </div>
        
        <div class="bottom-bar">
            <button class="primary-btn" id="btn-start-diy" disabled onclick="startDIY()">進入 DIY 編輯器</button>
        </div>
    </div>

</div>

<script>
    // 全域變數：儲存後台抓回來的資料與客人的選擇
    let shopData = { brands: [], models: [], styles: [] };
    let currentBrand = "";
    
    // 客人的訂單暫存
    let orderContext = {
        modelId: null,
        modelName: null,
        styleId: null,
        styleName: null,
        price: 0
    };

    window.onload = async () => {
        try {
            const res = await fetch('/api/shop_data');
            const data = await res.json();
            if(data.status === "success") {
                shopData = data.data;
                initUI();
            }
        } catch(e) {
            alert("無法連線到資料庫，請重新整理網頁");
        }
    };

    function initUI() {
        // 1. 渲染品牌標籤
        const brandTabs = document.getElementById('brand-tabs');
        brandTabs.innerHTML = '';
        shopData.brands.forEach((brand, index) => {
            const tab = document.createElement('div');
            tab.className = `brand-tab ${index === 0 ? 'active' : ''}`;
            tab.innerText = brand;
            tab.onclick = () => selectBrand(brand, tab);
            brandTabs.appendChild(tab);
        });

        // 2. 渲染款式列表 (只需渲染一次)
        const styleList = document.getElementById('style-list');
        styleList.innerHTML = '';
        shopData.styles.forEach(style => {
            const card = document.createElement('div');
            card.className = 'style-card';
            card.onclick = () => selectStyle(style, card);
            card.innerHTML = `
                <div class="style-img-placeholder"></div>
                <div class="style-info">
                    <div class="style-name">${style.name}</div>
                    <div class="style-desc">${style.desc}</div>
                    <div class="style-price">NT$ ${style.price}</div>
                </div>
            `;
            styleList.appendChild(card);
        });

        // 預設選擇第一個品牌
        if(shopData.brands.length > 0) {
            selectBrand(shopData.brands[0], brandTabs.firstChild);
        }
    }

    function selectBrand(brand, tabElement) {
        currentBrand = brand;
        
        // 更新標籤樣式
        document.querySelectorAll('.brand-tab').forEach(t => t.classList.remove('active'));
        if(tabElement) tabElement.classList.add('active');
        
        document.getElementById('current-brand-label').innerText = brand === 'Apple' ? '蘋果' : brand;

        // 渲染該品牌對應的型號
        const modelGrid = document.getElementById('model-grid');
        modelGrid.innerHTML = '';
        const filteredModels = shopData.models.filter(m => m.brand === brand);
        
        filteredModels.forEach(model => {
            const btn = document.createElement('div');
            btn.className = 'model-btn';
            // 如果這個型號之前被選過，保持選中狀態
            if(orderContext.modelId === model.id) btn.classList.add('selected');
            
            btn.innerText = model.name;
            btn.onclick = () => selectModel(model, btn);
            modelGrid.appendChild(btn);
        });
    }

    function selectModel(model, btnElement) {
        orderContext.modelId = model.id;
        orderContext.modelName = model.name;
        
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        
        // 解鎖下一步按鈕
        document.getElementById('btn-next-to-style').disabled = false;
        document.getElementById('display-selected-model').innerText = model.name;
    }

    function selectStyle(style, cardElement) {
        orderContext.styleId = style.id;
        orderContext.styleName = style.name;
        orderContext.price = style.price;
        
        document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
        cardElement.classList.add('selected');
        
        // 解鎖進入編輯器按鈕
        document.getElementById('btn-start-diy').disabled = false;
    }

    function goToPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function startDIY() {
        // 測試用：把收集到的訂單資料印出來，準備進入下一階段的編輯器
        alert(`準備進入編輯器！\n型號: ${orderContext.modelName}\n款式: ${orderContext.styleName}\n價格: NT$ ${orderContext.price}`);
        // 下一步：在這裡觸發渲染 Canvas 編輯器
    }
</script>
</body>
</html>
